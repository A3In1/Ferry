// Ferry wire protocol v1. Field numbers are forever: never reuse or renumber.
syntax = "proto3";
package ferry.v1;

// --- Session (ALPN "ferry/1"), control channel ---
message Hello {
  uint32 protocol_version = 1;
  string device_name = 2;
  repeated uint32 channels = 3; // channel ids this side supports
  // Sender's current LAN addresses ("ip:port"). Learned over any path (e.g. USB) so the
  // other side can reach us over Wi-Fi later without mDNS. Dial hints only; TLS authenticates.
  repeated string addrs = 4;
}

// --- Pairing (ALPN "ferry/pair/1") ---
message PairHello {
  string device_name = 1;
  bytes proof = 2;        // blake3 keyed hash (key = ticket secret) of the TLS exporter
  bytes presence_key = 3; // 32 bytes; peer uses it to recognise our mDNS/BLE presence tags
}
message PairConfirm {
  bool accepted = 1; // user confirmed the 6-digit code
}

// --- File channel ---
// Cancel (no message): the cancelling side resets the streams it writes and stops the ones it
// reads with application error code 0x07 (ERR_CANCELLED); the other side reports "cancelled",
// not "failed", and the receiver deletes its partial files. Older peers just see a failure.
message FileItem {
  string name = 1;
  uint64 size = 2;
  int64 mtime_unix_ms = 3;
  // Folder the file sits in, relative and "/"-separated ("DCIM/Camera"); "" = top level.
  // The receiver recreates it (sanitised); peers without this field save the file flat.
  string folder = 4;
}
message Offer {
  bytes transfer_id = 1; // 16 random bytes
  repeated FileItem items = 2;
}
message ItemAccept {
  bool accepted = 1;
  uint64 offset = 2; // bytes already held from an earlier attempt (resume)
}
message OfferReply {
  repeated ItemAccept items = 1; // same order as Offer.items
}
message DataHeader { // first message on each file data stream, raw bytes follow
  bytes transfer_id = 1;
  uint32 index = 2;
  uint64 offset = 3;
}
message ItemDone {
  uint32 index = 1;
  bytes blake3 = 2; // hash of the whole file
}
message ItemResult {
  uint32 index = 1;
  bool ok = 2;
  string error = 3;
  string saved_as = 4; // final file name after sanitising and conflict handling
}

// --- Events channel: small realtime messages (Phase 2), one Event per message ---
// Unknown oneof variants decode as an empty Event; receivers ignore them (forward compatible).
message Event {
  oneof kind {
    Notification notification = 1;
    NotificationRemoved notification_removed = 2;
    NotificationAction notification_action = 3;
    Clipboard clipboard = 4;
    NowPlaying now_playing = 5;
    MediaCommand media_command = 6;
    Battery battery = 7;
    Ring ring = 8;
    Link link = 9;
    SmsThreadsRequest sms_threads_request = 10;
    SmsThreads sms_threads = 11;
    SmsMessagesRequest sms_messages_request = 12;
    SmsMessages sms_messages = 13;
    SmsMessage sms_new = 14;
    SmsSend sms_send = 15;
    Call call = 16;
    CallCommand call_command = 17;
    CallLogRequest call_log_request = 18;
    CallLog call_log = 19;
    FsListRequest fs_list_request = 20;
    FsList fs_list = 21;
    FsGet fs_get = 22;
    WifiNetwork wifi_network = 23;
    Dnd dnd = 24;
    SmsMarkRead sms_mark_read = 25;
    SmsRead sms_read = 26;
    PhoneRunning phone_running = 27;
    CallDial call_dial = 28;
  }
}
message NotifButton {
  string id = 1;
  string title = 2;
  bool reply = 3; // takes text input (RemoteInput)
}
message Notification { // phone → Mac; same key again = update
  string key = 1;
  string app_name = 2;
  string package = 3;
  string title = 4;
  string text = 5;
  reserved 6;
  repeated NotifButton buttons = 7;
}
message NotificationRemoved { // phone → Mac
  string key = 1;
}
message NotificationAction { // Mac → phone
  string key = 1;
  string button_id = 2; // empty with dismiss = true
  string reply_text = 3;
  bool dismiss = 4;
}
message Clipboard { // both ways
  string text = 1;
}
message NowPlaying { // phone → Mac; active = false clears it
  bool active = 1;
  string app_name = 2;
  string title = 3;
  string artist = 4;
  bool playing = 5;
  reserved 6, 7;
}
message MediaCommand { // Mac → phone
  enum Cmd {
    PLAY_PAUSE = 0;
    NEXT = 1;
    PREVIOUS = 2;
  }
  Cmd cmd = 1;
}
message Battery { // phone → Mac
  uint32 percent = 1;
  bool charging = 2;
}
message Ring { // Mac → phone: find my phone
  bool start = 1; // false = stop ringing
}
message Link { // both ways: open this URL on the other device
  string url = 1;
}

// --- Phase 5: messages and calls (phone is the source of truth; the Mac only asks and shows) ---
message SmsThreadsRequest { // Mac → phone; answered with SmsThreads
  int32 limit = 1; // 0 = phone default (50)
}
message SmsThread {
  int64 thread_id = 1;
  string address = 2;
  string name = 3; // contact name, empty if unknown
  string snippet = 4;
  int64 date_ms = 5;
  int32 unread = 6; // inbox texts not yet read on the phone or on any Mac
}
message SmsThreads { // phone → Mac, newest first
  repeated SmsThread threads = 1;
}
message SmsMessagesRequest { // Mac → phone; answered with SmsMessages
  int64 thread_id = 1;
  int32 limit = 2; // 0 = phone default (100)
}
message SmsMessage {
  int64 id = 1;
  int64 thread_id = 2;
  string address = 3;
  string name = 4;
  string body = 5;
  int64 date_ms = 6;
  bool outgoing = 7;
}
message SmsMessages { // phone → Mac, oldest first
  int64 thread_id = 1;
  repeated SmsMessage messages = 2;
}
message SmsSend { // Mac → phone: the user pressed Send on the Mac
  string address = 1;
  string body = 2;
}
message SmsMarkRead { // Mac → phone: the user read this conversation on the Mac
  int64 thread_id = 1;
}
message PhoneRunning { // phone → Mac: Ferry was stopped on the phone, or is back
  bool running = 1;
}
message SmsRead { // phone → Mac: this conversation has no unread texts any more (read on the phone or another Mac)
  int64 thread_id = 1;
}
message Call { // phone → Mac on every call state change
  enum State {
    IDLE = 0;
    RINGING = 1;
    ACTIVE = 2;
  }
  State state = 1;
  string number = 2;
  string name = 3;
}
message CallCommand { // Mac → phone
  enum Cmd {
    ANSWER = 0;
    DECLINE = 1; // also hangs up an active call
  }
  Cmd cmd = 1;
}
message CallDial { // Mac → phone: place a call to this number
  string number = 1;
}
message CallLogRequest { // Mac → phone; answered with CallLog
  int32 limit = 1; // 0 = phone default (50)
}
message CallEntry {
  enum Kind {
    INCOMING = 0;
    OUTGOING = 1;
    MISSED = 2;
  }
  string number = 1;
  string name = 2;
  int64 date_ms = 3;
  int32 duration_s = 4;
  Kind kind = 5;
}
message CallLog { // phone → Mac, newest first
  repeated CallEntry calls = 1;
}

// --- Phase 6: phone files, Wi-Fi sharing, Do Not Disturb ---
message FsListRequest { // Mac → phone; answered with FsList
  string path = 1; // relative to the phone's shared storage root; "" = root
}
message FsEntry {
  string name = 1;
  bool dir = 2;
  uint64 size = 3;
  int64 modified_ms = 4;
}
message FsList { // phone → Mac
  string path = 1;
  repeated FsEntry entries = 2;
  string error = 3; // non-empty: e.g. "allow file access in Ferry on the phone"
}
message FsGet { // Mac → phone: send these files to me over the file channel
  repeated string paths = 1; // relative to the root
}
message WifiNetwork { // Mac → phone: offer to add this network (the phone asks the user)
  string ssid = 1;
  string password = 2; // empty = open network
}
message Dnd { // both ways: Do Not Disturb turned on/off (phone → Mac), or please set it (Mac → phone)
  bool on = 1;
}
