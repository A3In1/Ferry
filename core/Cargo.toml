[package]
name = "ferry-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-proto.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["net", "process"] }
prost.workspace = true
blake3.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand = "0.10"
hex = "0.4"
mdns-sd = { version = "0.21", optional = true, default-features = false, features = ["async"] }

[features]
# LAN presence via the mdns-sd crate (CLI and Mac app). Android uses NsdManager instead.
mdns = ["dep:mdns-sd"]

[dev-dependencies]
tempfile = "3"
